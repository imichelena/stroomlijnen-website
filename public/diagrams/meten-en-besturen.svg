<svg xmlns="http://www.w3.org/2000/svg" class="architecture-map" viewBox="0 0 860 490" role="img" aria-labelledby="architecture-title architecture-desc">
<style>text{font-family:Inter,Arial,sans-serif}.architecture-energy{fill:none;stroke:#00b0e4;stroke-width:3}.architecture-control{fill:none;stroke:#73a400;stroke-width:2;stroke-dasharray:6 5}.architecture-platform{fill:none;stroke:#8998a5;stroke-width:2;stroke-dasharray:2 5}.architecture-box{fill:white;stroke:#b7c4bf;stroke-width:1.2}.architecture-zone{fill:#7a8b84;font-size:11px;letter-spacing:.13em}.architecture-label{fill:#0c2340;font-size:14px;font-weight:500}.architecture-small{fill:#71837c;font-size:11px}</style>
  <title id="architecture-title">Stroom loopt via de verdeler. De EMS-besturing geeft opdrachten.</title>
  <desc id="architecture-desc">Op locatie loopt elektrisch vermogen van het net via de meter en verdeler naar het gebouw en de laders. Het lokale EMS ontvangt metingen en begrenst de laders. Het cloudplatform ondersteunt inzicht en beheer, met communicatie via de lokale netwerkgrens. Het EMS is geen onderdeel van de vermogenskabel.</desc>
